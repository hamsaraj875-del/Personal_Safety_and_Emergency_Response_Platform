name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Jaagrath Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: ./app
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          if ! ./gradlew assembleDebug --no-daemon; then
            echo "### Gradle Build Error" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ./gradlew compileDebugKotlin 2>&1 | grep -A 2 -B 1 "e: " | head -n 40 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Jaagrath Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jaagrath-app-debug
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
